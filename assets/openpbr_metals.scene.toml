# OpenPBR Metals Showcase — Hyperion demo
# 15 metal spheres in 3 rows × 5, lit by IBL panorama.
# Spacing 2.5 (radius 0.70, gap 1.10) ensures inter-sphere reflections are visible.
# Materials from openpbr_metals.materials.toml (F0/F82 conductor model).

material_libraries = ["openpbr_metals.materials.toml", "floor.materials.toml"]

[render]
reference = "presets/meadow_64spp_6bounce.render.toml"

[camera]
reference = "presets/openpbr_studio_wide.camera.toml"
translate = [0.0, 2.5, -10.0]
rotate_x = -9.2933
rotate_y = 180.0000

# Ground plane

# ── Meshes (declared once; object space) ──────────────────────────────────────

[[mesh]]
name = "box"
type = "box"
half_extents = [12.0, 0.1, 10.0]

[[mesh]]
name = "sphere"
type = "sphere"
radius = 0.7

# ── Instances (place a mesh with a transform + material) ──────────────────────

[[instance]]
mesh = "box"
material = "NeutralFloor"
translate = [0.0, -0.05, 1.0]

# ── Row 0  z = -2.0 ───────────────────────────────────────────────────────────
[[instance]]
mesh = "sphere"
material = "Copper"
translate = [-5.0, 0.7, -2.0]

[[instance]]
mesh = "sphere"
material = "Gold"
translate = [-2.5, 0.7, -2.0]

[[instance]]
mesh = "sphere"
material = "Silver"
translate = [0.0, 0.7, -2.0]

[[instance]]
mesh = "sphere"
material = "Platinum"
translate = [2.5, 0.7, -2.0]

[[instance]]
mesh = "sphere"
material = "Iridium"
translate = [5.0, 0.7, -2.0]

# ── Row 1  z = +0.5 ───────────────────────────────────────────────────────────
[[instance]]
mesh = "sphere"
material = "AluminumBrushed"
translate = [-5.0, 0.7, 0.5]

[[instance]]
mesh = "sphere"
material = "Iron"
translate = [-2.5, 0.7, 0.5]

[[instance]]
mesh = "sphere"
material = "Titanium"
translate = [0.0, 0.7, 0.5]

[[instance]]
mesh = "sphere"
material = "StainlessSteel"
translate = [2.5, 0.7, 0.5]

[[instance]]
mesh = "sphere"
material = "Brass"
translate = [5.0, 0.7, 0.5]

# ── Row 2  z = +3.0 ───────────────────────────────────────────────────────────
[[instance]]
mesh = "sphere"
material = "Chromium"
translate = [-5.0, 0.7, 3.0]

[[instance]]
mesh = "sphere"
material = "Cobalt"
translate = [-2.5, 0.7, 3.0]

[[instance]]
mesh = "sphere"
material = "Nickel"
translate = [0.0, 0.7, 3.0]

[[instance]]
mesh = "sphere"
material = "Zinc"
translate = [2.5, 0.7, 3.0]

[[instance]]
mesh = "sphere"
material = "Palladium"
translate = [5.0, 0.7, 3.0]
