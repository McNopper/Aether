# MaterialX OFFICIAL OpenPBR example materials (gathered 2026-11-16).
#
# Source: AcademySoftwareFoundation/MaterialX - resources/Materials/Examples/
# OpenPbr/*.mtlx (main), converted 1:1 by tools/mtlx_to_aether/mtlx_to_toml.py
# (no parameter dropped - verified input-by-input). Every source is FLAT by
# inspection: open_pbr_surface root, all inputs literal values, ZERO nodegraphs
# and ZERO nodedef/graph references - the procedural-node-graph sources the NH4
# directive excludes were filtered out before conversion. The ten sources are
# pinned as converter fixtures (tests/fixtures + tests/expected goldens).
#
# Each section keeps its upstream material name for spec-conformance side by
# side with the MaterialX reference. NOTE: Glass / Pearl / Velvet shadow
# same-named materials in OTHER asset libraries - insert_or_assign means the
# LAST loaded library wins, so do not co-load those pairs in one scene.
#
# Color values are linear Rec.709 (file-level colorspace below).

model = "openpbr"
colorspace = "lin_rec709_scene"

# --- open_pbr_default.mtlx ------------------------------------------------------
[Default]
base_color = [0.8, 0.8, 0.8]
base_weight = 1.0
base_metalness = 0.0
